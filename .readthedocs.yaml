version: 2
build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  jobs:
    post_create_environment:
      - curl -LsSf https://astral.sh/uv/install.sh | sh
    post_install:
      - UV_PROJECT_ENVIRONMENT="$READTHEDOCS_VIRTUALENV_PATH" $HOME/.local/bin/uv sync --locked --no-dev --group docs --python "$READTHEDOCS_VIRTUALENV_PATH/bin/python"
sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
