[project]
name = "pysv-const-expr-parser"
version = "0.1.0"
description = "SystemVerilog constant expression parser using SLY"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Amal Khailtash", email = "amal.khailtash@gmail.com" }]
requires-python = ">=3.14"
dependencies = ["sly==0.5", "prompt-toolkit>=3.0.50", "pygments>=2.19.1"]

[project.urls]
Homepage = "https://github.com/amal-khailtash/pysv-const-expr-parser"
Documentation = "https://pysv-const-expr-parser.readthedocs.io/"
Issues = "https://github.com/amal-khailtash/pysv-const-expr-parser/issues"

[project.scripts]
sv_expr_parser_repl = "amal.eda.systemverilog.const_expr_parser.repl:main"

[project.optional-dependencies]
# Reference tests only; the production parser and REPL use SLY.
slang = ["pyslang>=7.0.1,<8"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "amal"
namespace = true
source-exclude = ["src/**/visitor-old.py"]

[dependency-groups]
dev = ["pytest>=8.4.2", "pytest-cov>=7", "ruff>=0.17", { include-group = "docs" }]
docs = ["sphinx>=8", "myst-parser>=4", "sphinx-rtd-theme>=3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-markers", "--tb=short"]
markers = ["slang: optional pyslang reference tests"]

[tool.coverage.run]
source = ["amal.eda.systemverilog.const_expr_parser"]
branch = true
omit = ["*/visitor-old.py"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = [".ai", ".codex", ".agents", ".temp", "tests/old*.py", "typings", "tests/reference", "src/**/visitor-old.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# SLY's metaclass supplies grammar decorators and permits repeated productions.
"src/**/lexer.py" = ["F811", "F821"]
"src/**/parser.py" = ["F811", "F821"]
